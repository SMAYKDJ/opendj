[package]
name = "opendj-live"
description = "Battle Live: phone cameras, the vertical picture, the scene director and the ffmpeg output for TikTok and other vertical livestreams"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
opendj-control = { path = "../control" }
opendj-remote = { path = "../remote" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
rustls-pki-types = "1"
